$kind: http-request
name: 'Servicio 12 — reagendar cita (PDF)'
order: 2000
method: POST
url: '{{lucy_base}}/asistencias/reagendar'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "telefono": "{{telefono_qa}}",
      "id_asistencia": {{id_asistencia_reag}},
      "fecha": "2026-09-30",
      "hora": "10:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('reagendado', () => pm.expect(j.estado).to.eql(200));
