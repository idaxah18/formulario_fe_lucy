$kind: http-request
name: 'Servicio 1 — asistencias en proceso'
order: 1000
method: POST
url: '{{omniax_base}}/v1/chatbot/medico-dental/asistencias/en-proceso'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{omniax_access_token}}'
body:
  type: json
  content: |-
    {
      "identificacion_titular": "{{cedula_qa}}",
      "id_servicio": {{id_servicio_medico}},
      "para_reagendar": false
    }
